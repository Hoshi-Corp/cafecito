name: Test

# Reusable workflow: install, lint, type-check and test with a coverage gate. Called by ci.yml and
# publish.yml so both share one implementation. The production build is
# exercised by the Docker image build in each caller.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # LayoutProps and friends are generated into .next/, which a clean checkout lacks.
      - name: Type-check
        run: pnpm exec next typegen && pnpm exec tsc --noEmit

      # Fails below the 85% thresholds set in vitest.config.mts.
      - name: Test with coverage
        run: pnpm test --coverage
