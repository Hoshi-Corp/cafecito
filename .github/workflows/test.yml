name: Test

# Reusable workflow: install, lint, type-check and test with a coverage gate. Called by ci.yml and
# publish.yml so both share one implementation. The production build is
# exercised by the Docker image build in each caller.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps and friends are generated into .next/, which a clean checkout lacks.
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit

      # Fails below the 85% thresholds set in vitest.config.mts.
      - name: Test with coverage
        run: npm test -- --coverage
