# Deployment descriptor for the published image. Bound to localhost only so a
# reverse proxy on the same host (nginx, Caddy) is the public front door.
# The SQLite database lives in the cafecito-data volume (see the README for backups).
services:
  cafecito:
    build: .
    image: ghcr.io/hoshi-corp/cafecito:latest
    container_name: cafecito
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-4174}:4174"
    volumes:
      - cafecito-data:/data

volumes:
  cafecito-data:
